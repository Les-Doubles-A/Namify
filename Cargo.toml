[package]
name = "namify"
version = "2.0.0"
edition = "2024"
description = "Namify - renommage de fichiers par lot"
authors = ["Les-Doubles-A"]
license = "MIT"
repository = "https://github.com/Les-Doubles-A/Namify"
build = "build.rs"

[[bin]]
name = "Namify"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.18"
regex = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
unicode-normalization = "0.1"
natord = "1"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
imagesize = "0.14"
walkdir = "2"
crc32fast = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
